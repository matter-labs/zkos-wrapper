name: "Rust CI"
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
      - name: Compile
        run: cargo build --verbose
      - name: tests
        # Increased stack for quotient computation. 256 MiB, not 64: at `security_100`
        # `all_layers_full_test` overflows 64 MiB and aborts.
        run:  RUST_MIN_STACK=268435456 cargo test all_layers_full_test --release -- --nocapture
      - name: check_aux_params tests
        # Exercises the --check-aux-params path, which the full test above does not
        # cover: the off-circuit validation (matching and mismatched aux_params),
        # the in-circuit constraints (prepare_and_allocate_public_inputs with
        # check_aux_params = true, plus the direct PI packing), and the recursion
        # -chain fold depth (from_base_binary aux_params == proof registers 18..=25).
        run:  RUST_MIN_STACK=268435456 cargo test --release -- --nocapture check_aux_params_off_circuit_validation test_verifier_inner_function_check_aux_params from_base_binary_aux_params_fold_depth
      - name: host cache tests
        # Exercises the SnarkWrapper session-cache API: the into_host_cache /
        # from_host_cache roundtrip must preserve the config (including trusted
        # VKs) and the already-loaded binary commitment.
        run:  RUST_MIN_STACK=268435456 cargo test --release -- --nocapture host_cache_roundtrip

  gpu_check:
    name: gpu_check
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
      - name: Check gpu feature
        # `gpu` is not a default feature, so the other jobs never compile the
        # GPU backend (wrapper/src/gpu, wrapper/src/wrapper/gpu.rs). The CI
        # runners have no CUDA toolkit; ZKSYNC_USE_CUDA_STUBS makes the
        # zksync-crypto-gpu build scripts emit stubs instead, which is enough
        # to type-check the GPU code paths on CPU-only machines.
        run: ZKSYNC_USE_CUDA_STUBS=true cargo check --features gpu --all-targets

  mersenne_tests:
    name: mersenne_tests
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile minimal
      - name: Compile
        working-directory: ./circuit_mersenne_field
        run: cargo build --verbose
      - name: tests
        working-directory: ./circuit_mersenne_field
        run: cargo test --release -- --nocapture --test-threads=1

  wrapper_generated:
    name: wrapper_generated
    runs-on: [matterlabs-ci-runner-c3d]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@9d7e65c320fdb52dcd45ffaa68deb6c02c8754d9 # v1.12.0
        with:
          rustflags: ""
      - name: Setup
        run: |
          rustup set profile default
      - name: Regenerate wrapper
        run: cargo run --bin wrapper_generator --release
      - name: Check if anything has changed
        run: |
          MODIFIED_FILES=$(git status --porcelain)
          if [ -n "$MODIFIED_FILES" ]; then
            echo "The following files were modified - did you run wrapper_generator? "
            echo "$MODIFIED_FILES"
            exit 1
          else
            echo "No files were modified."
          fi
